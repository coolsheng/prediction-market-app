[package]
name = "prediction-market-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_http = "0.11"
http = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "test-util"] }
aws-config = { version = "1.0", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1.0"
anyhow = "1.0"
regex = "1.12.3"
reqwest = "0.13.2"
dotenv = "0.15.0"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[package.metadata.lambda.watch]
env_file = ".env"

[package.metadata.lambda.deploy]
env_file = ".env.production"

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
panic = 'abort'
strip = true