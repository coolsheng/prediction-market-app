version: 1
applications:
  - appRoot: mobile
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20
            - |
              if [ -f yarn.lock ]; then
                yarn
              elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                npm ci --cache .npm --prefer-offline
              else
                npm install
              fi
        build:
          commands:
            - npx expo export -p web
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
